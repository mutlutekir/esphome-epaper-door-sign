# Board: Espressif ESP32-S3-DevKitC-1-N8R8 (8 MB Flash Quad, 8 MB PSRAM Octal)
# Definition: definitions/boards/esp32-s3-devkitc1-n8r8/manifest.yaml

esphome:
  name: door-message-board
  friendly_name: Door Message Board
  comment: "Elecrow CrowPanel 4.2 inch E-Paper Door Message Board"

  on_boot:
    priority: 600
    then:
      - switch.turn_on: epd_power
      - delay: 500ms
        
api:
  encryption:
    key: "YOUR_API_KEY_HERE"

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Door Message Board Fallback Hotspot
    password: "YOUR_FALLBACK_PASSWORD_HERE"

substitutions:
  device_name: crowpanel-door
  friendly_name: "Door Delivery Board"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

captive_portal:

# ============================================================
# E-PAPER POWER
# ============================================================
switch:
  - platform: gpio
    pin: GPIO7
    id: epd_power
    name: "E-Paper Power"
    restore_mode: ALWAYS_ON
    internal: true

# ============================================================
# MANUAL CLEAR BUTTON (Anti-Ghosting)
# ============================================================
button:
  - platform: template
    name: "Clear Screen (Full Refresh)"
    id: force_full_refresh
    icon: "mdi:refresh"
    on_press:
      then:
        - component.update: epd

# ============================================================
# EXTERNAL COMPONENT
# ============================================================
external_components:
  - source:
      type: git
      url: https://github.com/ESPBoards/esphome-lvgl-crowpanel-epaper-5.79-4.2
      ref: main
    components:
      - crowpanel_epaper

# ============================================================
# E-PAPER
# ============================================================
display:
  - platform: crowpanel_epaper
    id: epd

    # V1.0 = SSD1683
    # V1.2 = UC8276C
    model: "4.20in-v1.2" 

    clk_pin: GPIO12
    mosi_pin: GPIO11
    cs_pin: GPIO45
    dc_pin: GPIO46
    reset_pin: GPIO47
    busy_pin: GPIO48

    rotation: 0

    # Full refresh every 1 update reduces ghosting for low-frequency updates.
    full_update_every: 1

    auto_clear_enabled: false
    update_interval: never

# ============================================================
# FONTS
# ============================================================
font:
  - file: "gfonts://Roboto"
    id: font_title
    size: 38
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~"

  - file: "gfonts://Roboto"
    id: font_small
    size: 26
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~"

  - file: "gfonts://Roboto"
    id: font_medium
    size: 32
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~"

  - file: "gfonts://Roboto"
    id: font_large
    size: 38
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~"

  - file: "gfonts://Roboto"
    id: font_tiny
    size: 14 # Scaled down for smaller labels if needed
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~"

image:
  - file: "bottom_image_flower_cat.png"
    id: image_bottom_flower_cat
    type: BINARY
    dither: NONE

# ============================================================
# FONT SIZE SELECTION (Optimized)
# ============================================================
select:
  - platform: template
    name: "Message Font Size"
    id: font_size_selection
    optimistic: true
    options:
      - "Small"
      - "Medium"
      - "Large"
    initial_option: "Medium"
    on_value:
      then:
        - lvgl.widget.update:
            id: message_small
            hidden: !lambda 'return x != "Small";'
        - lvgl.widget.update:
            id: message_medium
            hidden: !lambda 'return x != "Medium";'
        - lvgl.widget.update:
            id: message_large
            hidden: !lambda 'return x != "Large";'
        - component.update: epd
          
# ============================================================
# DOOR MESSAGE
# ============================================================
text:
  - platform: template
    name: "Door Message"
    id: door_message_text
    optimistic: true
    mode: text
    min_length: 0
    max_length: 100
    initial_value: "Please leave the package at the door."
    on_value:
      then:
        - lvgl.label.update:
            id: message_small
            text: !lambda 'return x;'
        - lvgl.label.update:
            id: message_medium
            text: !lambda 'return x;'
        - lvgl.label.update:
            id: message_large
            text: !lambda 'return x;'
        - component.update: epd

# ============================================================
# LVGL SCREEN
# ============================================================
lvgl:
  displays:
    - epd

  buffer_size: 25%
  color_depth: 16

  theme:
    label:
      text_font: font_medium
      text_color: 0x000000

  pages:
    - id: main_page
      bg_color: 0xFFFFFF
      widgets:
        # ----------------------------------------------------
        # 1. UPPER FRAME
        # ----------------------------------------------------
        - obj:
            x: 8
            y: 8
            width: 384
            height: 220
            bg_color: 0xFFFFFF
            border_width: 3
            border_color: 0x000000
            radius: 8

            widgets:

              # --- DELIVERY TITLE ---
              - label:
                  id: title_label
                  align: TOP_MID
                  y: 5
                  text: "WELCOME"
                  text_font: font_title
                  text_color: 0x000000

              # --- SEPARATOR LINE (Aligned) ---
              - line:
                  points:
                    - 42, 52
                    - 342, 52
                  line_width: 2
                  line_color: 0x000000

              # --- MESSAGE (3 Different Font Sizes) ---
              - label:
                  id: message_small
                  align: TOP_MID
                  y: 65
                  width: 360
                  text: "Please leave the package at the door."
                  text_font: font_small
                  text_color: 0x000000
                  text_align: CENTER
                  long_mode: WRAP
                  hidden: true

              - label:
                  id: message_medium
                  align: TOP_MID
                  y: 65
                  width: 360
                  text: "Please leave the package at the door."
                  text_font: font_medium
                  text_color: 0x000000
                  text_align: CENTER
                  long_mode: WRAP
                  hidden: false

              - label:
                  id: message_large
                  align: TOP_MID
                  y: 65
                  width: 360
                  text: "Please leave the package at the door."
                  text_font: font_large
                  text_color: 0x000000
                  text_align: CENTER
                  long_mode: WRAP
                  hidden: true

        # ----------------------------------------------------
        # 2. BOTTOM IMAGE
        # ----------------------------------------------------
        - image:
            src: image_bottom_flower_cat
            align: BOTTOM_MID
            y: -5
