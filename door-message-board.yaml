# Board: Espressif ESP32-S3-DevKitC-1-N8R8 (8 MB Flash Quad, 8 MB PSRAM Octal)
# Definition: definitions/boards/esp32-s3-devkitc1-n8r8/manifest.yaml

esphome:
  name: door-message-board
  friendly_name: Door Message Board
  comment: "Elecrow CrowPanel 4.2 inch E-Paper Door Message Board"

  on_boot:
    priority: 600
    then:
      - switch.turn_on: epd_power
      - delay: 500ms
        
api:
  encryption:
    key: "YR+1nT3hE9br+vcPUby1qJe+0NFj3ezDhYJd+l6E65g="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Door Message Board Fallback Hotspot
    password: "POrrEja9mHM9"

substitutions:
  device_name: crowpanel-door
  friendly_name: "Door Package Board"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

captive_portal:

# ============================================================
# E-PAPER POWER
# ============================================================

switch:
  - platform: gpio
    pin: GPIO7
    id: epd_power
    name: "E-Paper Power"
    restore_mode: ALWAYS_ON
    internal: true

# ============================================================
# EXTERNAL COMPONENT
# ============================================================

external_components:
  - source:
      type: git
      url: https://github.com/ESPBoards/esphome-lvgl-crowpanel-epaper-5.79-4.2
      ref: main
    components:
      - crowpanel_epaper

# ============================================================
# E-PAPER
# ============================================================

display:
  - platform: crowpanel_epaper
    id: epd

    # V1.0 = SSD1683
    # V1.2 = UC8276C
    model: "4.20in-v1.2" 

    clk_pin: GPIO12
    mosi_pin: GPIO11
    cs_pin: GPIO45
    dc_pin: GPIO46
    reset_pin: GPIO47
    busy_pin: GPIO48

    rotation: 0

    # Full refresh every 8 updates.
    # Reduces ghosting.
    full_update_every: 8

    # Since we'll be using LVGL, ESPHome
    # won't clear the screen on its own.
    auto_clear_enabled: false
    update_interval: never

# ============================================================
# FONTS
# ============================================================

font:
  # Large title
  - file: "gfonts://Roboto"
    id: font_title
    size: 38
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ÇçĞğİıÖöŞşÜü"

  # Dynamic Message Fonts (3 different sizes)
  - file: "gfonts://Roboto"
    id: font_msg_small
    size: 26
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ÇçĞğİıÖöŞşÜü"

  - file: "gfonts://Roboto"
    id: font_msg_medium
    size: 32
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ÇçĞğİıÖöŞşÜü"

  - file: "gfonts://Roboto"
    id: font_msg_large
    size: 38
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ÇçĞğİıÖöŞşÜü"

  # Small info text
  - file: "gfonts://Roboto"
    id: font_info_small
    size: 18
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~ÇçĞğİıÖöŞşÜü"

image:
  - file: "en_alt_cicek_kedi.png"
    id: image_bottom_flower_cat
    type: BINARY
    dither: NONE

select:
  - platform: template
    name: "Message Font Size"
    id: font_size_select
    optimistic: true
    options:
      - "Small"
      - "Medium"
      - "Large"
    initial_option: "Medium"
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x == "Small";'
            then:
              - lvgl.widget.update:
                  id: msg_small
                  hidden: false
              - lvgl.widget.update:
                  id: msg_medium
                  hidden: true
              - lvgl.widget.update:
                  id: msg_large
                  hidden: true
        - if:
            condition:
              lambda: 'return x == "Medium";'
            then:
              - lvgl.widget.update:
                  id: msg_small
                  hidden: true
              - lvgl.widget.update:
                  id: msg_medium
                  hidden: false
              - lvgl.widget.update:
                  id: msg_large
                  hidden: true
        - if:
            condition:
              lambda: 'return x == "Large";'
            then:
              - lvgl.widget.update:
                  id: msg_small
                  hidden: true
              - lvgl.widget.update:
                  id: msg_medium
                  hidden: true
              - lvgl.widget.update:
                  id: msg_large
                  hidden: false
        - component.update: epd
          
# ============================================================
# DOOR MESSAGE (auto-created in Home Assistant)
# ============================================================

text:
  - platform: template
    name: "Door Message"
    id: door_message_text
    optimistic: true
    mode: text
    min_length: 0
    max_length: 100
    initial_value: "Please leave the package by the door."
    on_value:
      then:
        - lvgl.label.update:
            id: msg_small
            text: !lambda 'return x;'
        - lvgl.label.update:
            id: msg_medium
            text: !lambda 'return x;'
        - lvgl.label.update:
            id: msg_large
            text: !lambda 'return x;'
        - component.update: epd

# ============================================================
# DEFAULT MESSAGE
# ============================================================

globals:
  - id: default_message
    type: std::string
    restore_value: no
    initial_value: '"Welcome."'

# ============================================================
# LVGL SCREEN
# ============================================================
lvgl:
  displays:
    - epd

  buffer_size: 25%
  color_depth: 16

  on_draw_end:
    - component.update: epd

  theme:
    label:
      text_font: font_msg_medium
      text_color: 0x000000

  pages:
    - id: main_page
      bg_color: 0xFFFFFF
      widgets:
        # ----------------------------------------------------
        # 1. TOP FRAME (surrounds only the text)
        # ----------------------------------------------------
        - obj:
            x: 8
            y: 8
            width: 384
            height: 220
            bg_color: 0xFFFFFF
            border_width: 3
            border_color: 0x000000
            radius: 8

            widgets:
              # --- HEADER ---
              - label:
                  id: title_label
                  align: TOP_MID
                  y: 0
                  text: "WELCOME"
                  text_font: font_title
                  text_color: 0x000000

              # --- DIVIDER LINE ---
              - line:
                  points:
                    - 20, 50
                    - 325, 50
                  line_width: 2
                  line_color: 0x000000

              # --- MESSAGE (3 different font sizes) ---
              - label:
                  id: msg_small
                  align: TOP_MID
                  y: 55
                  width: 370
                  text: "Please leave the package by the door."
                  text_font: font_msg_small
                  text_color: 0x000000
                  text_align: CENTER
                  long_mode: WRAP
                  hidden: true

              - label:
                  id: msg_medium
                  align: TOP_MID
                  y: 55
                  width: 370
                  text: "Please leave the package by the door."
                  text_font: font_msg_medium
                  text_color: 0x000000
                  text_align: CENTER
                  long_mode: WRAP
                  hidden: false

              - label:
                  id: msg_large
                  align: TOP_MID
                  y: 55
                  width: 370
                  text: "Please leave the package by the door."
                  text_font: font_msg_large
                  text_color: 0x000000
                  text_align: CENTER
                  long_mode: WRAP
                  hidden: true

        # ----------------------------------------------------
        # 2. BOTTOM IMAGE (outside the frame, covers full screen)
        # ----------------------------------------------------
        - image:
            src: image_bottom_flower_cat
            align: BOTTOM_MID
            y: -5
